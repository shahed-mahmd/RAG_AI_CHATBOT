<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="544" viewBox="0 0 1000 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-map-title backend-map-desc">
        <title id="backend-map-title">How the Python backend works</title>
        <desc id="backend-map-desc">Uploading a PDF saves it, cuts its text into pieces and stores them in chroma_db; asking a question finds the 5 closest pieces there, and Gemini uses them to write the answer.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <text x="20" y="40" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Job 1: Upload a PDF</text>
        <text x="20" y="360" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Job 2: Ask a question</text>
        <path d="M180,120 H220" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M380,120 H420" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M580,120 H620" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M180,440 H220" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M380,440 H420" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M580,440 H620" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M780,440 H820" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M700,176 V224" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M700,336 V384" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M900,496 V516 Q900,524 892,524 H108 Q100,524 100,516 V496" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="460" y="504" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="513" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THE ANSWER</text>
        <rect x="20" y="64" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="64" width="160" height="112" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="100" y="107" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
        <text x="100" y="127" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Choose a PDF</text>
        <text x="100" y="143" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">in the browser</text>
        <rect x="220" y="64" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="64" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="99" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">main.py</text>
        <text x="300" y="119" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Checks it is a PDF</text>
        <text x="300" y="135" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">and saves it in</text>
        <text x="300" y="151" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">uploads/</text>
        <rect x="420" y="64" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="64" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="99" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chunker.py</text>
        <text x="500" y="119" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Reads the PDF and</text>
        <text x="500" y="135" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">cuts its text into</text>
        <text x="500" y="151" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">1000-character pieces</text>
        <rect x="620" y="64" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="64" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="107" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">memory.py</text>
        <text x="700" y="127" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Stores the pieces</text>
        <text x="700" y="143" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">in the database</text>
        <rect x="620" y="224" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="224" width="160" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="700" y="259" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chroma_db</text>
        <text x="700" y="279" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">The database. Holds</text>
        <text x="700" y="295" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">the pieces from</text>
        <text x="700" y="311" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">every PDF</text>
        <rect x="20" y="384" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="384" width="160" height="112" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="100" y="427" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
        <text x="100" y="447" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Type a question</text>
        <text x="100" y="463" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">in the browser</text>
        <rect x="220" y="384" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="384" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="427" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">main.py</text>
        <text x="300" y="447" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Receives the</text>
        <text x="300" y="463" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">question</text>
        <rect x="420" y="384" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="384" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="435" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">app.py</text>
        <text x="500" y="455" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Starts the search</text>
        <rect x="620" y="384" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="384" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="419" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Searcher.py</text>
        <text x="700" y="439" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Finds the 5 pieces</text>
        <text x="700" y="455" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">closest to the</text>
        <text x="700" y="471" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">question</text>
        <rect x="820" y="384" width="160" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="820" y="384" width="160" height="112" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="900" y="419" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini</text>
        <text x="900" y="439" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">app.py sends it the</text>
        <text x="900" y="455" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">pieces and question.</text>
        <text x="900" y="471" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">It writes the answer.</text>
        <text x="604" y="285" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Job 1 fills the database. Job 2 reads from it.</text>
      </svg>
